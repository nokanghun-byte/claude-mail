# v로 시작하는 태그(예: v1.1.0)를 올리면 확장 프로그램(.mcpb)을 만들어 릴리스에 붙인다.
name: Build extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: Build .mcpb
        shell: pwsh
        working-directory: extension
        run: ./build.ps1
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: dist/claude-mail.mcpb
      - name: Keep as build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: claude-mail-mcpb
          path: dist/claude-mail.mcpb
