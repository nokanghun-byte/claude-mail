<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 메일 웹처럼 세 칸. 왼쪽 계정·분류, 가운데 목록, 오른쪽 읽기 창. 좁은 화면에서는 목록과 읽기 창을 번갈아 보여 준다. */
:root{
  --bg:#F2F4F6;
  --surface:#FFFFFF;
  --surface2:#F9FAFB;
  --ink:#191F28;
  --ink2:#333D4B;
  --muted:#6B7684;
  --faint:#8B95A1;
  --line:#E5E8EB;
  --accent:#3182F6;
  --accent-ink:#FFFFFF;
  --accent-soft:#E8F3FF;
  --danger:#F04452;
  --danger-soft:#FFEEEE;
  --ok:#00A661;
  --act:#3182F6;
  --bill:#00A661;
  --news:#7B61FF;
  --ad:#8B95A1;
  --font:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101013;
    --surface:#1B1C21;
    --surface2:#222329;
    --ink:#F2F4F6;
    --ink2:#D1D6DB;
    --muted:#9EA4AE;
    --faint:#7E858F;
    --line:#2C2E35;
    --accent:#4C9AFF;
    --accent-ink:#0B1220;
    --accent-soft:#18283F;
    --danger:#FF6B76;
    --danger-soft:#3A1E22;
    --ok:#2FCB86;
    --act:#4C9AFF;
    --bill:#2FCB86;
    --news:#9C88FF;
    --ad:#7E858F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101013;
  --surface:#1B1C21;
  --surface2:#222329;
  --ink:#F2F4F6;
  --ink2:#D1D6DB;
  --muted:#9EA4AE;
  --faint:#7E858F;
  --line:#2C2E35;
  --accent:#4C9AFF;
  --accent-ink:#0B1220;
  --accent-soft:#18283F;
  --danger:#FF6B76;
  --danger-soft:#3A1E22;
  --ok:#2FCB86;
  --act:#4C9AFF;
  --bill:#2FCB86;
  --news:#9C88FF;
  --ad:#7E858F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;letter-spacing:-0.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:inherit}

/* 세 칸 틀 */
.app{display:grid;grid-template-columns:236px minmax(320px,400px) minmax(0,1fr);height:100vh;height:100dvh}
.side,.listpane,.readpane{min-height:0;overflow:auto}
.side{padding:24px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.listpane{background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column}
.readpane{background:var(--bg)}

/* 왼쪽: 계정·분류 */
.brand{font-size:22px;font-weight:700;padding:0 10px 14px;letter-spacing:-0.02em}
.side-h{font-size:13px;font-weight:600;color:var(--faint);padding:16px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink2);text-align:left}
.navbtn:hover{background:var(--surface2)}
.navbtn[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,27,55,.06)}
.navbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.navbtn .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#FFFFFF;background:var(--c);flex:none}
.navbtn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .num{font-size:13px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.navbtn .num.on{color:var(--accent)}
.navbtn.imaplink{color:var(--faint);font-size:14px}
.navbtn.imaplink .ic{background:var(--surface2);color:var(--ink2)}
.side-foot{margin:auto 10px 0;padding-top:18px;font-size:12px;line-height:1.55;color:var(--faint)}
.side-foot a{color:inherit}

/* 가운데: 목록 */
.lhead{position:sticky;top:0;z-index:2;background:var(--surface);padding:22px 20px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:10px}
.lrow h1{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em}
.lrow2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.fresh{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.iconbtn[disabled]{opacity:.4;cursor:default}
.iconbtn svg{width:20px;height:20px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,27,55,.08)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}
#notice{display:flex;flex-direction:column;gap:8px;padding:0 12px}
#notice:not(:empty){padding-top:12px}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink2);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.note.err{background:var(--danger-soft)}
.note strong{font-weight:700;width:100%}
.mlist{list-style:none;margin:0;padding:6px 8px 24px}
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;width:100%;padding:12px;border-radius:14px;text-align:left}
.mrow:hover{background:var(--surface2)}
.mrow[aria-current="true"]{background:var(--accent-soft)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#FFFFFF;background:var(--c)}
.mmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.mtop{display:flex;align-items:baseline;gap:8px;min-width:0}
.mfrom{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtime{flex:none;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.msubj{font-size:15px;font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msnip{font-size:13.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread .mfrom{color:var(--ink);font-weight:700}
.unread .msubj{color:var(--ink);font-weight:800}
.unread .msnip{color:var(--muted)}
.mrow.unread{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.mrow.unread:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface2))}
.mrow:not(.unread) .mfrom,.mrow:not(.unread) .msubj{font-weight:400}
.mrow:not(.unread) .msubj{color:var(--muted)}
.mrow:not(.unread) .msnip{color:var(--faint);opacity:.85}
.mrow:not(.unread) .av{opacity:.55;filter:saturate(.6)}
.mrow:not(.unread)[aria-current="true"] .av{opacity:1;filter:none}
.udot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.rdot{flex:none;font-size:11.5px;font-weight:600;color:var(--faint);align-self:center}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.cat{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.tag.work{color:var(--accent);background:var(--accent-soft)}
.tag.read{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tag.wait{color:var(--muted)}
.tag.fail{color:var(--danger);background:var(--danger-soft)}
.empty{padding:48px 20px;text-align:center;color:var(--faint);font-size:14px}
.skel{height:64px;margin:8px 12px;border-radius:14px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}

/* 오른쪽: 읽기 창 */
.reader{max-width:920px;margin:0 auto;padding:24px 28px 56px;display:flex;flex-direction:column;gap:14px}
.rtop{display:flex;align-items:center;gap:6px}
.back{display:none}
.rsubj{margin:4px 0 0;font-size:24px;font-weight:700;line-height:1.35;letter-spacing:-0.02em;overflow-wrap:anywhere}
.rmeta{display:flex;align-items:center;gap:12px}
.rmeta .who{display:flex;flex-direction:column;min-width:0}
.rmeta .nm{font-weight:700;font-size:15px}
.rmeta .dt{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;background:var(--surface);color:var(--ink2);border:1px solid var(--line);text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#FFFFFF;border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.status{font-size:13.5px;color:var(--muted)}
.status.ok{color:var(--ok);font-weight:600}
.status.bad{color:var(--danger)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--danger-soft);border-radius:12px;padding:10px 12px;font-size:14px}

.writebtn{width:100%;justify-content:center;padding:11px 14px;font-size:15px;margin:0 0 14px;border-radius:12px}
.writesm{padding:6px 12px;font-size:13.5px}
@media (min-width:1101px){.writesm{display:none}}
@media (max-width:1100px){.writebtn{display:none}}

.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 6px 0 12px;height:40px}
.searchbox svg{width:18px;height:18px;color:var(--faint);flex:none}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;outline:none;height:100%}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.tag.acct{color:#FFFFFF;background:var(--c)}

.tools.sub{gap:6px}
.tools.sub .btn{padding:6px 11px;font-size:13px}
.btn.staron{color:#F5A623;border-color:#F5A623}
.btn.ai{color:var(--news);border-color:color-mix(in srgb,var(--news) 40%,var(--line))}
.star{flex:none;font-size:13px;color:#F5A623}
.aicard{background:color-mix(in srgb,var(--news) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--news) 30%,var(--line));border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.aicard b{font-size:13px;color:var(--news)}
.aitext{white-space:pre-wrap;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.airow{display:flex;gap:8px}
.airow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px}
.avwrap{position:relative;width:40px;height:40px}
.avwrap .pick{position:absolute;inset:0;display:none;place-items:center;background:var(--surface);border-radius:50%;cursor:pointer}
.avwrap .pick input{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer}
.mrow:hover .pick,.mrow.picked .pick,.mrow:focus-within .pick{display:grid}
.mrow{cursor:pointer}
.mrow.picked{background:var(--accent-soft)}
.mrow.cursor{box-shadow:inset 3px 0 0 var(--accent)}
.bulkbar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 12px 0;padding:8px 10px;border-radius:12px;background:var(--ink);color:var(--surface)}
.bulkbar b{margin-right:4px;font-size:14px}
.bulkbar .btn{padding:5px 10px;font-size:13px}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.pickitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pickitem:hover{background:var(--surface2)}
.pickitem b{font-size:14.5px}
.pickitem span{font-size:12.5px;color:var(--faint)}
.pickitem.todo.high b{color:var(--danger)}
.keyrow{display:flex;align-items:center;gap:12px;padding:4px 0;font-size:14px}
.keyrow kbd{min-width:96px;font-family:inherit;font-size:13px;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;text-align:center}
@media (max-width:720px){#helpBtn{display:none}}

.confirmwin{width:min(420px,100%)}
.askmsg{margin:0 0 6px;font-size:15px;line-height:1.6;color:var(--ink2);overflow-wrap:anywhere}

.mlist li.swipe{position:relative;border-radius:14px;overflow:hidden}
.swipebg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:24px;background:var(--danger);color:#FFFFFF;font-weight:700;font-size:15px;border-radius:14px;opacity:0;transition:opacity .15s}
.mlist li.swiping .swipebg{opacity:1}
.mlist li.armed .swipebg{filter:brightness(.88)}
.mlist li.swipe .mrow{position:relative;background:var(--surface);touch-action:pan-y}
.mlist li.swipe .mrow:hover{background:var(--surface2)}
.mlist li.swipe .mrow[aria-current="true"],.mlist li.swipe .mrow.picked{background:var(--accent-soft)}


.driveitem{flex-direction:row;align-items:center;gap:10px}
.driveitem .fx{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#FFFFFF;background:var(--c);flex:none}
.driveitem .dtx{display:flex;flex-direction:column;min-width:0}
.driveitem .dtx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fchip.toobig{background:color-mix(in srgb,var(--danger) 10%,var(--surface2))}
.fchip.toobig em{color:var(--danger)}
.gmailweb{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink2)}

/* 새 메일 알림 */
.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:flex-start;gap:12px;background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 12px 14px 14px;box-shadow:0 12px 32px rgba(0,12,30,.18);cursor:pointer;animation:tin .25s ease-out;border:1px solid var(--line)}
.toast:hover{background:var(--surface2)}
.toast.out{opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast .tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.toast .tk{font-size:12px;font-weight:700;color:var(--accent)}
.toast b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .ts{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .iconbtn{width:28px;height:28px}
.tic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#FFFFFF;background:var(--c);flex:none}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}
@media (max-width:720px){.toasts{right:16px;left:16px;bottom:12px;width:auto}}

/* 팝업 창 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,12,30,.45);display:grid;place-items:center;padding:16px}
.modal{position:relative;width:min(720px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,12,30,.3);overflow:hidden}
.mhead{display:flex;align-items:center;gap:8px;padding:16px 18px 10px}
.mhead b{flex:1;font-size:18px;font-weight:700}
.mbody{padding:0 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.composewin{width:min(780px,100%)}
.drophint{display:none;position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent-soft) 88%,transparent);color:var(--accent);font-size:17px;font-weight:700;place-items:center;pointer-events:none}
.composewin.dropping .drophint{display:grid}
.cfield.ro b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.sugwrap{position:relative;flex:1;min-width:0;display:flex}
.sugwrap input{flex:1}
.sug{position:absolute;left:0;right:0;top:100%;z-index:5;margin:4px 0 0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,12,30,.14);max-height:280px;overflow:auto}
.sug li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.sug li:hover,.sug li.on{background:var(--accent-soft)}
.sug .st{display:flex;flex-direction:column;min-width:0}
.sug .st b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .st span{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.sm{width:28px;height:28px;font-size:12px}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.cardprev{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.cardprev img{max-width:360px;width:100%;border:1px solid var(--line);border-radius:10px;background:#FFFFFF}
.sigbtn{margin-top:10px}
@media (max-width:720px){ .sigbtn{display:none} .overlay{padding:0;place-items:end stretch} .modal{border-radius:20px 20px 0 0;max-height:94dvh;width:100%} }
.compose{display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--accent)}
.compose .confirm{background:var(--accent-soft)}
.chead{display:flex;align-items:center;gap:8px}
.chead b{flex:1;font-size:16px}
.cfield{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.cfield span{flex:none;width:68px;font-size:13.5px;color:var(--muted)}
.cfield input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;padding:6px 0;outline:none}
.cnote{font-size:13px;color:var(--muted)}
.cbody,.csigbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:inherit;font-size:15px;line-height:1.6;padding:12px 14px;resize:vertical}
.csigbox{font-size:13.5px}

.linkbtn{color:var(--accent);font-size:13.5px;font-weight:600}
.cfiles{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

.driverow{display:flex;flex-direction:column;gap:6px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.sharesel{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:6px 8px}

.cfoot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.cstatus{font-size:13.5px;color:var(--muted)}

.card{background:var(--surface);border-radius:20px;padding:6px;box-shadow:0 1px 3px rgba(0,27,55,.05)}
.card.pad{padding:18px 20px}
.msgsep{font-size:13px;color:var(--faint);padding:10px 14px 4px}
.body{font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:14px;font-family:inherit;color:var(--ink2)}
.mailframe{display:block;width:100%;min-height:120px;border:0;border-radius:16px;background:#FFFFFF;color-scheme:light}

.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}

.file[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.file .fx{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#FFFFFF;background:var(--c);flex:none;text-transform:uppercase}
.file .fn{display:flex;flex-direction:column;min-width:0}
.file .fn b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fn span{font-size:12px;color:var(--faint)}
.attview{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.attview .vh{display:flex;align-items:center;gap:8px;width:100%}
.attview .vh b{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.attview img{max-width:100%;height:auto;border-radius:8px;background:#FFFFFF}

/* 중간 폭: 목록과 읽기 창을 번갈아 */
@media (max-width:1100px){
  .app{grid-template-columns:212px minmax(0,1fr)}
  .app .readpane{grid-column:2}
  .app.reading .listpane{display:none}
  .app:not(.reading) .readpane{display:none}
  .back{display:grid}
}
/* 휴대폰 폭: 왼쪽 칸을 위쪽 가로 줄로 */
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:auto;min-height:100dvh}
  .side{flex-direction:column;padding:14px 16px 6px;gap:8px;overflow:visible}
  .brand{display:none}
  .side-h,.side-foot{display:none}
  .nav{flex-direction:row;gap:6px;overflow-x:auto;scrollbar-width:none}
  .navbtn{width:auto;flex:none;padding:7px 12px;border-radius:999px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
  .navbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);box-shadow:none}
  .navbtn[aria-pressed="true"] .num{color:inherit;opacity:.8}
  .navbtn .ic{display:none}
  .app .listpane,.app .readpane{grid-column:1;border:0;overflow:visible}
  .lhead{padding:14px 16px 10px}
  .reader{padding:12px 16px 48px}
  .rsubj{font-size:20px}
  .mrow{padding:12px 8px}
}

/* ---------- 마감 다듬기 ----------
   방향: 색은 '받은 메일의 주인'(계정)과 '할 일'(파란 강조)에만 쓰고, 나머지는 잉크의 농담으로 정리한다.
   진한 색 덩어리(꽉 찬 아바타·계정 배지)를 옅은 바탕 + 진한 글자로 바꿔 목록이 한눈에 읽히게 한다. */
[hidden]{display:none !important}
:root{

}

    --shadow-sm:0 1px 2px rgba(0,0,0,.35);

    --shadow-lg:0 20px 56px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 14px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 20px 56px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.35);
}
body{letter-spacing:-0.005em;font-feature-settings:"tnum" 0;word-break:keep-all;overflow-wrap:break-word;caret-color:var(--accent)}
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--faint) 45%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--faint) 40%,transparent);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--faint) 65%,transparent)}
::-webkit-scrollbar-track{background:transparent}
button,a,.mrow,.navbtn,.btn,.file,.toast{transition:background-color .15s ease-out,color .15s ease-out,box-shadow .15s ease-out,border-color .15s ease-out}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

.btn.staron{color:#C98100;border-color:color-mix(in srgb,#F5A623 45%,var(--line));background:color-mix(in srgb,#F5A623 10%,transparent)}
.card{border-radius:16px;box-shadow:var(--shadow-md);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.body{font-size:16px;line-height:1.75;padding:20px 22px;color:var(--ink2);text-wrap:pretty}

      if (/(^|\.)(gmail|googlemail)\.com$/.test(host)) return;
      IMAP_PRESETS.forEach(function(x){ if (!p && x[0].test(host)) p = x; });
      var label = p ? p[1] : a.name;
      if (used[label]) label += " (" + a.name + ")";   // 같은 곳 계정이 여럿이면 이름으로 구분
      used[label] = true;
      ACC[a.name] = {label: label, server: HOST.imap, site: p ? p[3] : ""};
      ACC_COLOR[a.name] = p ? p[2] : IMAP_PALETTE[imapList.length % IMAP_PALETTE.length];
      imapList.push(a.name);
    });
    if (save){ try{ localStorage.setItem("mailImapAccts", JSON.stringify((list || []).map(function(a){ return {name: a.name, host: a.host}; }))); }catch(e){} }
    renderImapNav();
  }
  function renderImapNav(){
    var nav = document.getElementById("accts"), link = document.getElementById("imapLink");
    if (!nav) return;
    Array.prototype.slice.call(nav.querySelectorAll("[data-imap]")).forEach(function(b){ b.parentNode.removeChild(b); });
    imapList.forEach(function(n){
      var b = document.createElement("button"); b.type = "button"; b.className = "navbtn";
      b.setAttribute("data-account", n); b.setAttribute("data-imap", "1"); b.style.setProperty("--c", ACC_COLOR[n]);
      var ic = document.createElement("span"); ic.className = "ic"; ic.textContent = ACC[n].label.charAt(0).toUpperCase();
      var lb = document.createElement("span"); lb.className = "lbl"; lb.textContent = ACC[n].label;
      var nu = document.createElement("span"); nu.className = "num";
      b.appendChild(ic); b.appendChild(lb); b.appendChild(nu);
      b.addEventListener("click", function(){ state.account = n; sel = null; persist(); load(false); });
      nav.insertBefore(b, link);
    });
    if (link){ nav.appendChild(link); link.querySelector(".lbl").textContent = imapList.length ? "메일 계정 추가" : "다른 메일 연결"; }   // 항상 맨 아래에 보인다
  }
  // 계정 목록을 imap 서버에서 다시 읽는다 (PC 확인 창이 뜰 수 있으므로 IMAP을 쓰는 순간에만 부른다)
  function refreshImapAccounts(){
    if (!mcp) return Promise.reject({code: "server_not_connected"});
    return resolveHosts().then(function(){ return mcp.callTool(HOST.imap, "imap_list_accounts", {}, {cache: false}); }).then(function(r){
      var p = (r && r.payload) || {};
      // 빈 목록이 오면(확장 프로그램이 막 다시 켜지는 중 등) 알고 있던 계정을 지우지 않는다. 계정 삭제는 따로 한다.
      if (!(p.accounts || []).length && imapList.length) throw {code: "upstream_error", message: "empty account list"};
      setImapAccounts(p.accounts || [], true);
      imapListFresh = true;
      if (state.account !== "all" && !ACC[state.account]){ state.account = "gmail"; persist(); }
      return imapList;
    });
  }
  function ensureImapAccounts(){
    if (imapListFresh) return Promise.resolve(imapList);
    return refreshImapAccounts().catch(function(){ return imapList; });
  }
  try{ setImapAccounts(JSON.parse(localStorage.getItem("mailImapAccts") || "null") || [], false); }catch(e){}

  try{
    var saved = JSON.parse(localStorage.getItem("mailview") || "null");
    if (saved){
      if (ACC[saved.account]) state.account = saved.account;
      if (saved.rv === 2 && ["all","today","yesterday","week","month"].indexOf(saved.range) !== -1) state.range = saved.range;
      state.unreadOnly = !!saved.unreadOnly;
      if (["sent", "inbox", "drafts", "trash"].indexOf(saved.box) !== -1) state.box = saved.box;
      if (saved.cat === "all" || CATS.some(function(c){ return c.key === saved.cat; })) state.cat = saved.cat;
    }
  }catch(e){}
  function persist(){ try{ localStorage.setItem("mailview", JSON.stringify(Object.assign({rv: 2}, state))); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  var ICON = {
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.6l6.1-.8z"/></svg>'
  };
  function iconBtn(name, cls){ var b = el("button", cls === undefined ? "iconbtn" : cls); b.innerHTML = ICON[name]; return b; }
  var decoder = document.createElement("textarea");
  function decode(s){ decoder.innerHTML = String(s || ""); return decoder.value; }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // 읽기 호출: 다시 시도해도 되는 오류만 한 번 재시도
  function readTool(server, tool, input, fresh){
    var opts = fresh ? {cache:{refresh:true}} : undefined;
    return mcp.callTool(server, tool, input, opts).catch(function(e){
      if (e && e.retryable){
        var wait = Math.min(e.retryAfterMs || 0, 8000) || (600 + Math.random() * 900);
        return sleep(wait).then(function(){ return mcp.callTool(server, tool, input, opts); });
      }
      throw e;
    });
  }

  function loadLabels(){
    if (labelNames) return Promise.resolve(labelNames);
    return readTool("Gmail", "list_labels", {}).then(function(r){
      var map = {};
      var ls = (r.payload && r.payload.labels) || [];
      for (var i = 0; i < ls.length; i++) map[ls[i].labelId] = ls[i].name;
      labelNames = map; return map;
    }).catch(function(){ return {}; });   // 라벨 이름이 없어도 목록은 보여 준다
  }

  // Gmail 처리: 대화 단위 도구를, 한 통씩 나눈 메일이면 메일 단위 도구로 바꿔 부른다
  function gTool(x, tool, extra){
    var inp = Object.assign({}, extra || {});
    if (!x.mid){ inp.threadId = x.id; return mcp.callTool("Gmail", tool, inp, {cache: false}); }
    inp.messageId = x.mid;
    var p = mcp.callTool("Gmail", tool.replace("_thread", "_message"), inp, {cache: false});
    if (tool === "untrash_thread") p = p.then(function(){ return mcp.callTool("Gmail", "label_message", {messageId: x.mid, labelIds: ["INBOX"]}, {cache: false}); });
    return p;
  }
  function fetchGmail(range, fresh, sent, q){
    var b = rangeBounds(range, new Date(), loadMul);
    if (q) b = {from: addDays(startOfDay(new Date()), -SEARCH_SINCE_DAYS), to: addDays(startOfDay(new Date()), 1)};
    var query = q ? q + (sent ? " in:sent" : " -in:sent") + " -in:drafts newer_than:1y" : sent ? "in:sent after:" + ymd(addDays(b.from, -1), "/") : "after:" + ymd(addDays(b.from, -1), "/") + " -in:sent -in:drafts";
    var items = [], storedAt = null, pages = 0;
    function page(token){
      var input = {query: query, pageSize: 50, view: sent ? "THREAD_VIEW_SUMMARY" : "THREAD_VIEW_MINIMAL"};
      if (token) input.pageToken = token;
      return readTool("Gmail", "search_threads", input, fresh).then(function(r){
        var p = r.payload || {};
        if (r.cache && r.cache.storedAt) storedAt = storedAt ? Math.min(storedAt, r.cache.storedAt) : r.cache.storedAt;
        var ts = p.threads || [];
        for (var i = 0; i < ts.length; i++){
          splitGmailThread(ts[i], labelNames, sent).forEach(function(it){
            if (inRange(it.dateMs, b)){ it.snippet = decode(it.snippet); it.subject = decode(it.subject); items.push(it); }
          });
        }
        pages++;
        if (p.nextPageToken && pages < (q ? 2 : 6) * loadMul) return page(p.nextPageToken);
        return {items: items, at: storedAt || Date.now(), more: !!p.nextPageToken};
      });
    }
    return loadLabels().then(function(){ return page(null); });
  }

  function fetchImap(account, range, fresh, sent, q){
    if (q){
      var since = ymd(addDays(startOfDay(new Date()), -SEARCH_SINCE_DAYS), "-");
      var base = sent ? {accountName: account, since: since, folder: "Sent Messages", limit: 100}
                      : {accountName: account, since: since, searchAllFolders: true, includeTrash: false, limit: 100};
      var who = sent ? "to" : "from";
      var tries = [Object.assign({subject: q}, base), Object.assign((function(){ var o = {}; o[who] = q; return o; })(), base)];
      return Promise.all(tries.map(function(inp){ return readTool(HOST.imap, "imap_search_emails", inp, fresh); })).then(function(rs){
        var seen = {}, items = [], more = false, at = Date.now();
        rs.forEach(function(r){
          var p = r.payload || {}, ms = p.messages || [];
          if ((p.totalFound || 0) > (p.returned || ms.length)) more = true;
          if (r.cache && r.cache.storedAt) at = Math.min(at, r.cache.storedAt);
          ms.forEach(function(m){
            if (sent && !m.folder) m.folder = "Sent Messages";
            var it = mapImapMessage(m, sent);
            if (!it) return;
            it.acc = account; it.id = account + ":" + it.id;
            if (!seen[it.id]){ seen[it.id] = true; items.push(it); }
          });
        });
        return {items: items, at: at, more: more};
      });
    }
    var b = rangeBounds(range, new Date(), loadMul);
    var input = sent
      ? {accountName: account, since: ymd(addDays(b.from, -1), "-"), folder: "Sent Messages", limit: 300 * loadMul}
      : {accountName: account, since: ymd(addDays(b.from, -1), "-"), searchAllFolders: true, includeTrash: false, limit: 300 * loadMul};
    return readTool(HOST.imap, "imap_search_emails", input, fresh).then(function(r){
      var p = r.payload || {};
      var ms = p.messages || [], items = [];
      for (var i = 0; i < ms.length; i++){
        if (sent && !ms[i].folder) ms[i].folder = "Sent Messages";
        var it = mapImapMessage(ms[i], sent);
        if (it && inRange(it.dateMs, b)){ it.acc = account; it.id = account + ":" + it.id; items.push(it); }
      }
      return {items: items, at: (r.cache && r.cache.storedAt) || Date.now(),
              more: (p.totalFound || 0) > (p.returned || ms.length)};
    });
  }

  // 임시보관함: Gmail은 Gmail 연결로, IMAP 계정은 각 계정의 임시보관함 폴더에서 읽는다. 전체 메일함이면 모두 합친다.
  function fetchDrafts(fresh, q){
    var a = state.account;
    if (a === "gmail") return fetchGmailDrafts(fresh, q);
    if (a !== "all") return fetchImapDrafts(a, fresh, q);
    return ensureImapAccounts().then(function(){
      var accs = ["gmail"].concat(imapNames());
      return Promise.all(accs.map(function(x){
        return (x === "gmail" ? fetchGmailDrafts(fresh, q) : fetchImapDrafts(x, fresh, q)).catch(function(e){ return {err: e || {code: "upstream_error"}, acc: x}; });
      }));
    }).then(function(parts){
      var items = [], errs = {}, at = Date.now(), more = false;
      parts.forEach(function(p){ if (p.err){ errs[p.acc] = p.err; return; } items = items.concat(p.items); at = Math.min(at, p.at || at); more = more || p.more; });
      if (parts.length && parts.every(function(p){ return p.err; })) throw parts[0].err;
      return {items: items, at: at, more: more, partErrors: errs};
    });
  }
  function addrText(a){ return typeof a === "string" ? a : a ? (a.name && a.address ? a.name + " <" + a.address + ">" : (a.address || a.email || a.text || "")) : ""; }
  function addrList(v){ return (Array.isArray(v) ? v : v ? [v] : []).map(addrText).filter(Boolean); }
  function draftsFolderOf(acc){
    return imapFolders(acc).then(function(fds){
      var f = fds.filter(function(fd){ return /drafts/i.test(fd.use || ""); })[0] || fds.filter(function(fd){ return /^(Drafts|Draft|임시보관함|임시 보관함)$/i.test(fd.name); })[0];
      return f ? f.name : null;
    });
  }
  function fetchImapDrafts(acc, fresh, q){
    return draftsFolderOf(acc).then(function(folder){
      if (!folder) return {items: [], at: Date.now(), more: false};
      var since = ymd(addDays(startOfDay(new Date()), -365), "-");
      return readTool(HOST.imap, "imap_search_emails", {accountName: acc, folder: folder, since: since, limit: 100}, fresh).then(function(r){
        var p = r.payload || {}, ms = p.messages || [], items = [], ql = String(q || "").toLowerCase();
        ms.forEach(function(m){
          var tos = addrList(m.to), subj = m.subject || "(제목 없음)";
          if (ql && (subj + " " + tos.join(" ")).toLowerCase().indexOf(ql) === -1) return;
          items.push({id: acc + ":d:" + m.uid, isDraft: true, acc: acc, uid: m.uid, folder: folder,
            dateMs: Date.parse(m.date) || Date.now(), from: tos.length ? tos.join(", ") : "(받는 사람 없음)", to: tos, cc: [],
            subject: subj, body: null, snippet: "", unread: false, chips: [], work: false, count: 1, cat: "act", url: "", fromAddr: ""});
        });
        return {items: items, at: (r.cache && r.cache.storedAt) || Date.now(), more: (p.totalFound || 0) > ms.length};
      });
    });
  }
  function fetchGmailDrafts(fresh, q){
    var input = {pageSize: 50, view: "DRAFT_VIEW_FULL"};
    if (q) input.query = q;
    return readTool("Gmail", "list_drafts", input, fresh).then(function(r){
      var p = r.payload || {};
      var items = (p.drafts || []).map(function(d){
        var m = d.message || d;
        var tos = m.toRecipients || d.toRecipients || [];
        var body = m.plaintextBody || d.plaintextBody || "";
        return {id: "d:" + (d.id || d.draftId), draftId: d.id || d.draftId, isDraft: true,
          dateMs: Date.parse(m.date || d.date) || Date.now(), from: tos.length ? tos.join(", ") : "(받는 사람 없음)",
          to: tos, cc: m.ccRecipients || d.ccRecipients || [], subject: m.subject || d.subject || "(제목 없음)",
          body: body, snippet: body.replace(/\s+/g, " ").slice(0, 120), unread: false, chips: [], work: false, count: 1, cat: "act", url: ""};
      });
      return {items: items, at: (r.cache && r.cache.storedAt) || Date.now(), more: !!p.nextPageToken};
    });
  }

  function isTrashFolder(fd){ return /trash/i.test(fd.use || "") || /^(Deleted Messages|휴지통|Trash|Deleted Items)$/i.test(fd.name); }
  function fetchTrash(acc, fresh, q){
    if (acc === "gmail"){
      var items = [], pages = 0, storedAt = null;
      var page = function(token){
        var input = {query: "in:trash" + (q ? " " + q : ""), pageSize: 50, view: "THREAD_VIEW_SUMMARY", includeTrash: true};
        if (token) input.pageToken = token;
        return readTool("Gmail", "search_threads", input, fresh).then(function(r){
          var p = r.payload || {};
          if (r.cache && r.cache.storedAt) storedAt = storedAt ? Math.min(storedAt, r.cache.storedAt) : r.cache.storedAt;
          (p.threads || []).forEach(function(t){
            var it = mapGmailThread(t, labelNames, false, true);
            if (it){ it.snippet = decode(it.snippet); it.subject = decode(it.subject); it.inTrash = true; it.unread = false; items.push(it); }
          });
          pages++;
          if (p.nextPageToken && pages < 2 * loadMul) return page(p.nextPageToken);
          return {items: items, at: storedAt || Date.now(), more: !!p.nextPageToken};
        });
      };
      return loadLabels().then(function(){ return page(null); });
    }
    return imapFolders(acc).then(function(fds){
      var tf = fds.filter(isTrashFolder)[0];
      if (!tf) return {items: [], at: Date.now(), more: false};
      var input = {accountName: acc, folder: tf.name, since: ymd(addDays(startOfDay(new Date()), -365), "-"), limit: 200 * loadMul};
      if (q) input.subject = q;
      return readTool(HOST.imap, "imap_search_emails", input, fresh).then(function(r){
        var p = r.payload || {}, ms = p.messages || [], items = [];
        ms.forEach(function(m){
          if (!m.folder) m.folder = tf.name;
          var it = mapImapMessage(m, false, true);
          if (it){ it.acc = acc; it.id = acc + ":" + it.id; it.inTrash = true; it.unread = false; it.chips = []; items.push(it); }
        });
        return {items: items, at: (r.cache && r.cache.storedAt) || Date.now(), more: (p.totalFound || 0) > (p.returned || ms.length)};
      });
    });
  }

  function fetchAll(range, fresh, sent, q){
    return ensureImapAccounts().then(function(){ return fetchAllNow(range, fresh, sent, q); });
  }
  function fetchAllNow(range, fresh, sent, q){
    var accs = ["gmail"].concat(imapNames());
    return Promise.all(accs.map(function(a){
      var p = state.box === "trash" ? fetchTrash(a, fresh, q) : a === "gmail" ? fetchGmail(range, fresh, sent, q) : fetchImap(a, range, fresh, sent, q);
      return p.then(function(res){ return {acc: a, res: res}; }, function(e){ return {acc: a, err: e || {code: "upstream_error"}}; });
    })).then(function(parts){
      var items = [], errs = {}, more = false, at = Date.now();
      parts.forEach(function(pt){
        if (pt.err){ errs[pt.acc] = pt.err; return; }
        if (pt.acc !== "gmail") imapOk[pt.acc] = true;
        items = items.concat(pt.res.items); more = more || pt.res.more; at = Math.min(at, pt.res.at || at);
        if (!q && !sent && range === "today" && state.box === "inbox") seedKnown(pt.acc, pt.res.items);
      });
      if (Object.keys(errs).length === accs.length) throw errs.gmail || errs[Object.keys(errs)[0]];
      return {items: items, at: at, more: more, partErrors: errs};
    });
  }

  function load(fresh){
    var key = keyOf(state.account);
    if (!mcpReady){ render(); return; }
    if (!mcp){ render(); return; }
    if (store[key] && !store[key].error && !fresh){ render(); return; }
    var seq = ++loadSeq;
    store[key] = {loading: true, items: (store[key] && store[key].items) || null, at: store[key] && store[key].at};
    render();
    var sentBox = state.box === "sent";
    var q = state.q;
    loadMul = moreLv[key] || 1;
    var p = state.box === "drafts" ? fetchDrafts(fresh, q) : state.account === "all" ? fetchAll(state.range, fresh, sentBox, q)
          : state.box === "trash" ? fetchTrash(state.account, fresh, q)
          : state.account === "gmail" ? fetchGmail(state.range, fresh, sentBox, q) : fetchImap(state.account, state.range, fresh, sentBox, q);
    p.then(function(res){
      res.items.sort(function(a, b){ return b.dateMs - a.dateMs; });
      store[key] = res;
      var kacc = key.split("|")[0];
      if (kacc !== "gmail" && kacc !== "all") imapOk[kacc] = true;
      if (kacc !== "all" && /\|inbox\|today$/.test(key)) seedKnown(kacc, res.items);
    }).catch(function(e){
      var denied = e && ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","consent_required"].indexOf(e.code) !== -1;
      store[key] = {error: e || {code:"upstream_error"}, items: denied ? null : (store[key] && store[key].items) || null, at: store[key] && store[key].at};
    }).then(function(){ if (seq === loadSeq || key !== keyOf(state.account)) render(); else render(); });
  }

  // 읽음 처리는 쓰기 작업이라 자동으로 다시 시도하지 않는다. 실패하면 버튼으로만 다시 시도한다.
  function markRead(x){
    if (!x.unread || x.marking || !mcp) return;
    x.marking = true; x.markErr = null; render();
    var call = x.acc
      ? mcp.callTool(HOST.imap, "imap_mark_as_read", {accountName: x.acc, folder: x.folder, uid: x.uid}, {cache: false})
      : gTool(x, "unlabel_thread", {labelIds: ["UNREAD"]});
    call.then(function(){
      x.unread = false; x.justRead = true; noteState(x);
      if (x.acc) mcp.invalidate(HOST.imap, "imap_search_emails").catch(function(){});
      else mcp.invalidate("Gmail", "search_threads").catch(function(){});
    }).catch(function(e){ x.markErr = e || {code: "upstream_error"}; })
      .then(function(){ x.marking = false; render(); });
  }
  function toggle(x){
    if (open[x.id] && !open[x.id].error){ render(); return; }   // 이미 불러온 메일은 다시 불러오지 않는다
    open[x.id] = {loading: true}; render();
    if (x.acc){
      readTool(HOST.imap, "imap_get_email", {accountName: x.acc, folder: x.folder, uid: x.uid, bodyFormat: "html", maxContentLength: 600000, includeAttachmentText: false}).then(function(r){
        var e = (r.payload && r.payload.email) || {}, att = [];
        (e.attachments || []).forEach(function(a){
          var n = a && (a.filename || a.name || a.fileName);
          if (n) att.push({name: String(n), mime: a.contentType || "", size: a.size, key: "i:" + n, cid: String(a.contentId || "").replace(/^<|>$/g, "")});
        });
        if (!open[x.id]) return;
        var cut = e.contentTruncated && e.contentTruncated.html;
        open[x.id] = {msgs: [{from: x.from, dateMs: x.dateMs, html: e.htmlContent || "", truncated: !!cut,
                              body: cleanBody(e.textContent || e.markdownContent || ""), att: att}], atts: {}};
        render();
        markRead(x);
      }).catch(function(e){
        if (open[x.id]) open[x.id] = {error: e || {code: "upstream_error"}};
        render();
      });
      return;
    }
    (x.mid ? readTool("Gmail", "get_message", {messageId: x.mid, messageFormat: "FULL_CONTENT"}).then(function(r){ return {payload: {messages: [r.payload || {}]}}; })
           : readTool("Gmail", "get_thread", {threadId: x.id, messageFormat: "FULL_CONTENT"})).catch(function(e){
      // Gmail 연결은 휴지통 대화 전체(get_thread)는 막지만 메일 한 통씩(get_message)은 열어 준다
      if (!x.inTrash || !/permission/i.test(String(e && e.message || "") + " " + String(e && e.code || ""))) throw e;
      var ids = (x.msgIds && x.msgIds.length) ? x.msgIds : [x.id];
      return Promise.all(ids.map(function(id){ return readTool("Gmail", "get_message", {messageId: id, messageFormat: "FULL_CONTENT"}); }))
        .then(function(rs){ return {payload: {messages: rs.map(function(r){ return r.payload || {}; }).filter(function(m){ return m.id; })}}; });
    }).then(function(r){
      var p = r.payload || {}, ms = p.messages || [], out = [];
      for (var i = 0; i < ms.length; i++){
        var m = ms[i], nm = m.sender || "", ns = m.addressDisplayNames || [];
        for (var j = 0; j < ns.length; j++) if (ns[j].emailAddress === m.sender && ns[j].displayName){ nm = ns[j].displayName; break; }
        var att = [];
        (m.attachments || []).forEach(function(a){
          var n = a && (a.filename || a.name || a.fileName);
          if (n && a.id) att.push({name: String(n), mime: a.mimeType || "", id: a.id, msgId: m.id, key: "g:" + m.id + ":" + a.id});
        });
        out.push({id: m.id, addr: m.sender || "", toList: m.toRecipients || [], ccList: m.ccRecipients || [],
                  from: nm, dateMs: Date.parse(m.date), html: m.htmlBody || "",
                  body: cleanBody(m.plaintextBody || decode(m.snippet || "")), att: att});
      }
      if (!open[x.id]) return;            // 불러오는 사이에 접었으면 읽음 처리도 하지 않는다
      open[x.id] = {msgs: out, atts: {}};
      render();
      markRead(x);
    }).catch(function(e){
      if (open[x.id]) open[x.id] = {error: e || {code: "upstream_error"}};
      render();
    });
  }

  // 카카오·네이버 메일과 같은 메일(Message-ID가 같은 것)을 Gmail에서 찾아 그 첨부 목록을 돌려준다
  function gmailTwin(x){
    if (x.gmailTwin) return x.gmailTwin;
    var id = String(x.msgid || "").replace(/^\s*<|>\s*$/g, "");
    if (!id){ x.gmailTwin = Promise.resolve(null); return x.gmailTwin; }
    x.gmailTwin = readTool("Gmail", "search_threads", {query: "rfc822msgid:" + id + " in:anywhere", pageSize: 3, view: "THREAD_VIEW_IDS_ONLY"}).then(function(r){
      var ts = (r.payload && r.payload.threads) || [];
      if (!ts.length) return null;
      return readTool("Gmail", "get_thread", {threadId: ts[0].id, messageFormat: "PLAIN_TEXT"}).then(function(t){
        var ms = (t.payload && t.payload.messages) || [], list = [];
        ms.forEach(function(m){ (m.attachments || []).forEach(function(at){ if (at && at.id) list.push({msgId: m.id, id: at.id, name: at.filename || "", mime: at.mimeType || ""}); }); });
        return list;
      });
    }).catch(function(){ return null; });
    return x.gmailTwin;
  }
  function gmailTwinAtt(x, a){
    function norm(s){ return String(s || "").normalize ? String(s || "").normalize("NFC").trim() : String(s || "").trim(); }
    return gmailTwin(x).then(function(list){
      if (!list) return null;
      var hit = list.filter(function(g){ return norm(g.name) === norm(a.name); })[0];
      if (!hit) return null;
      return mcp.callTool("Gmail", "download_gmail_attachment", {messageId: hit.msgId, attachmentId: hit.id, filename: hit.name, mimeType: hit.mime || undefined}, {cache: false})
        .then(function(r){ return attFromResult(r, hit.mime).blob ? r : null; });
    });
  }

  // 첨부 보기: 누르면 불러와서 창 안에 보여 주고, 다시 누르면 접는다
  function toggleAtt(x, o, a){
    var st = o.atts[a.key];
    if (st && !st.loading){ st.shown = !st.shown; render(); return; }
    if (st) return;
    o.atts[a.key] = {loading: true, shown: true}; render();
    var imapCall = function(){
      return mcp.callTool(HOST.imap, "imap_download_attachment", {accountName: x.acc, folder: x.folder, uid: x.uid, filename: a.name, extractText: true}, {cache: false});
    };
    var call = x.acc
      // 카카오·네이버: 같은 메일이 Gmail에도 들어와 있으면 거기서 원본 파일을 받는다 (없으면 imap으로)
      ? gmailTwinAtt(x, a).then(function(r){ return r || imapCall(); }, imapCall)
      : mcp.callTool("Gmail", "download_gmail_attachment", {messageId: a.msgId, attachmentId: a.id, filename: a.name, mimeType: a.mime || undefined}, {cache: false});
    call.then(function(r){
      var got = attFromResult(r, a.mime);
      var s = {shown: true, text: got.text, blob: got.blob};
      if (got.blob){ s.url = URL.createObjectURL(got.blob); return s; }
      s.blockTypes = ((r && r.content) || []).map(function(b){
        return (b && b.type) + (b && b.resource ? "/" + (b.resource.mimeType || "") + (b.resource.blob ? "+blob" : b.resource.text ? "+text" : "") : "");
      }).join(", ");
      if (!x.acc) return s;
      // 카카오·네이버: 사진이 아니면 imap이 PC에 파일을 저장하고 경로만 알려 준다.
      // 그 파일을 PC의 markitdown으로 읽어 표·문단 형태로 보여 준다.
      var p = (r && r.payload && typeof r.payload === "object") ? r.payload : {};
      s.text = p.textContent || "";
      s.savedPath = p.path || "";
      if (!s.savedPath) return s;
      var markdown = function(){
        var viaExt = /\.(docx|xlsx|xlsm|xls|csv|ods|pptx)$/i.test(s.savedPath) ? mcp.callTool(HOST.att, "convert_document", {path: s.savedPath}, {cache: false}) : Promise.reject({code: "skip"});
        return viaExt.catch(function(){ return mcp.callTool("host:markitdown", "convert_to_markdown", {uri: fileUri(s.savedPath)}, {cache: false}); }).then(function(m){
        var v = m && m.payload;
        s.md = typeof v === "string" ? v : (v && typeof v.result === "string" ? v.result : "");
        return s;
      }).catch(function(e){ s.mdError = e || {code: "upstream_error"}; return s; }); };
      // 먼저 PC의 첨부 도우미로 원본 파일을 받아 형식별 미리보기로 연다. 도우미가 없으면 글자로 보여 준다.
      var base = String(s.savedPath).split(/[\\/]/).pop();
      return mcp.callTool(HOST.att, "read_saved_attachment", {filename: base}, {cache: false}).then(function(r2){
        var got2 = attFromResult(r2, a.mime);
        if (!got2.blob) return markdown();
        s.blob = got2.blob; s.url = URL.createObjectURL(got2.blob); s.text = "";
        return s;
      }, function(e){ s.helperError = e || {code: "upstream_error"}; return markdown(); });
    }).then(function(s){
      o.atts[a.key] = s;
    }).catch(function(e){
      o.atts[a.key] = {shown: true, error: e || {code: "upstream_error"}};
    }).then(render);
  }
  function saveAtt(a, s){
    if (!downloads || !s.blob) return;
    s.saveMsg = "저장 창을 여는 중"; render();
    downloads.save({filename: a.name, data: s.blob}).then(function(){ s.saveMsg = "저장했습니다"; })
      .catch(function(e){ s.saveMsg = e && e.code === "cancelled" ? "저장을 취소했습니다" : "저장하지 못했습니다"; })
      .then(render);
  }

  // 삭제: 각 메일함의 휴지통으로 옮긴다. 쓰기 작업이라 자동 재시도는 하지 않는다.
  // 휴지통에 이미 있는 카카오 메일은 지우면 영구 삭제되므로 버튼을 보여 주지 않는다 (canDelete).
  function canDelete(x){ return !x.inTrash && !x.isDraft && (!x.acc || x.folder !== "Deleted Messages"); }
  function trash(x){
    if (x.deleting || !mcp || !canDelete(x)) return Promise.resolve(false);
    x.deleting = true; x.delErr = null; render();
    var call = x.acc
      ? mcp.callTool(HOST.imap, "imap_delete_email", {accountName: x.acc, folder: x.folder, uid: x.uid}, {cache: false})
      : gTool(x, "trash_thread");
    return call.then(function(){
      x.trashed = true; x.confirmDel = false; delete open[x.id]; dropTrashLists(); delete picked[x.id]; noteState(x);
      trashNote = {x: x};
      if (x.acc) mcp.invalidate(HOST.imap, "imap_search_emails").catch(function(){});
      else mcp.invalidate("Gmail", "search_threads").catch(function(){});
      return true;
    }).catch(function(e){ x.delErr = e || {code: "upstream_error"}; return false; })
      .then(function(ok){ x.deleting = false; render(); return ok; });
  }
  function untrash(){
    var n = trashNote;
    if (!n || n.undoing) return;
    n.undoing = true; n.error = null; render();
    gTool(n.x, "untrash_thread").then(function(){
      n.x.trashed = false; n.undone = true; noteState(n.x);
      mcp.invalidate("Gmail", "search_threads").catch(function(){});
    }).catch(function(e){ n.error = e || {code: "upstream_error"}; })
      .then(function(){ n.undoing = false; render(); });
  }

  // 메일 HTML을 격리된 틀에 그리고, 내용 높이에 맞춰 틀 높이를 늘린다
  function mailFrame(html, showImages){
    var f = document.createElement("iframe");
    f.className = "mailframe";
    f.title = "메일 본문";
    f.setAttribute("sandbox", "allow-same-origin allow-popups allow-popups-to-escape-sandbox");
    f.setAttribute("referrerpolicy", "no-referrer");
    function fit(){
      try{
        var d = f.contentDocument;
        if (!d || !d.documentElement) return;
        var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
        if (h) f.style.height = (h + 4) + "px";
      }catch(e){}
    }
    f.addEventListener("load", function(){
      fit();
      try{
        var imgs = f.contentDocument.images;
        for (var i = 0; i < imgs.length; i++) imgs[i].addEventListener("load", fit);
      }catch(e){}
      setTimeout(fit, 400); setTimeout(fit, 1500);
    });
    f.srcdoc = frameDoc(html, showImages);
    return f;
  }

  // ---- 첨부 미리보기: 형식별로 페이지 안에서 직접 그린다 ----
  var LIBS = {
    pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
    pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
    xlsx: "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
    zip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
    docx: "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"
  };
  var libLoads = {};
  function loadLib(key){
    if (libLoads[key]) return libLoads[key];
    libLoads[key] = new Promise(function(res, rej){
      var sc = document.createElement("script");
      sc.src = LIBS[key]; sc.async = true;
      sc.onload = function(){ res(); };
      sc.onerror = function(){ delete libLoads[key]; rej(new Error("lib")); };
      document.head.appendChild(sc);
    });
    return libLoads[key];
  }
  function extOf(name){ var m = /\.([a-z0-9]+)$/i.exec(name || ""); return m ? m[1].toLowerCase() : ""; }
  function kindOf(name, type){
    var e = extOf(name); type = type || "";
    if (/^image\//.test(type) || /^(jpe?g|png|gif|webp|bmp|svg)$/.test(e)) return "image";
    if (/pdf/.test(type) || e === "pdf") return "pdf";
    if (/^(docx|docm|dotx)$/.test(e)) return "docx";
    if (/^(xlsx|xlsm|xls|xlsb|ods)$/.test(e) || /spreadsheet|ms-excel/.test(type)) return "sheet";
    if (/^(pptx|ppsx|potx)$/.test(e)) return "pptx";
    if (e === "hwpx") return "hwpx";
    if (/^(zip)$/.test(e) || /zip/.test(type)) return "zip";
    if (/^(html?|xhtml)$/.test(e) || /html/.test(type)) return "html";
    if (/^(eml)$/.test(e) || /rfc822/.test(type)) return "text";
    if (/^(txt|csv|tsv|json|xml|md|log|ini|yml|yaml)$/.test(e) || /^text\//.test(type) || /json|xml|csv/.test(type)) return "text";
    if (/^(mp3|m4a|wav|ogg)$/.test(e) || /^audio\//.test(type)) return "audio";
    if (/^(mp4|webm|mov)$/.test(e) || /^video\//.test(type)) return "video";
    if (e === "hwp") return "hwp";
    return "other";
  }
  function note(box, text){ box.appendChild(el("span", "cap", text)); }
  // 문서 XML 안의 글자(<*:t>)를 문단(<*:p>) 단위로 모은다 — hwpx·pptx 공통
  function xmlText(xml){
    var doc = new DOMParser().parseFromString(xml, "application/xml"), out = [];
    var ps = doc.getElementsByTagName("*");
    for (var i = 0; i < ps.length; i++){
      if (ps[i].localName !== "p") continue;
      var ts = ps[i].getElementsByTagName("*"), line = "";
      for (var j = 0; j < ts.length; j++) if (ts[j].localName === "t") line += ts[j].textContent;
      if (line.trim()) out.push(line);
    }
    return out.join("\n");
  }
  function sortNum(a, b){ return (parseInt(a.replace(/\D+/g, ""), 10) || 0) - (parseInt(b.replace(/\D+/g, ""), 10) || 0); }

  function renderPdf(box, blob){
    var MAX = 40;
    // PDF 처리기를 별도 작업 공간(워커) 없이 이 페이지 안에서 돌린다.
    // claude.ai 화면 안에서는 워커를 띄우는 것이 막힐 수 있어서, 처리기 스크립트를 먼저 읽어 두면 pdf.js가 페이지 안에서 처리한다.
    return loadLib("pdf").then(function(){ return loadLib("pdfWorker"); }).then(function(){ return blob.arrayBuffer(); }).then(function(buf){
      var lib = window.pdfjsLib;
      if (!lib) throw new Error("PDF 보기 프로그램을 불러오지 못했어요");
      lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
      return lib.getDocument({data: new Uint8Array(buf), isEvalSupported: false}).promise;
    }).then(function(pdf){
      var n = Math.min(pdf.numPages, MAX);
      var head = el("span", "cap", pdf.numPages + "쪽" + (pdf.numPages > MAX ? " 중 앞 " + MAX + "쪽만 보여 줍니다" : ""));
      box.appendChild(head);
      var chain = Promise.resolve();
      for (var p = 1; p <= n; p++) (function(p){
        chain = chain.then(function(){ return pdf.getPage(p); }).then(function(page){
          var width = Math.max(320, Math.min(box.clientWidth || 760, 1100));
          var base = page.getViewport({scale: 1});
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          var vp = page.getViewport({scale: (width / base.width) * dpr});
          var c = document.createElement("canvas");
          c.width = vp.width; c.height = vp.height;
          c.style.width = "100%"; c.style.maxWidth = width + "px"; c.style.display = "block";
          c.style.background = "#FFFFFF"; c.style.border = "1px solid var(--line)"; c.style.marginTop = "8px";
          box.appendChild(c);
          return page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
        });
      })(p);
      return chain;
    });
  }
  function renderDocx(box, blob){
    return Promise.all([loadLib("docx"), blob.arrayBuffer()]).then(function(r){
      return window.mammoth.convertToHtml({arrayBuffer: r[1]});
    }).then(function(res){ box.appendChild(mailFrame(res.value || "<p>(내용 없음)</p>", false)); });
  }
  function renderSheet(box, blob){
    return Promise.all([loadLib("xlsx"), blob.arrayBuffer()]).then(function(r){
      var X = window.XLSX, wb = X.read(new Uint8Array(r[1]), {type: "array"});
      var html = "<style>table{border-collapse:collapse;font-size:12.5px}td,th{border:1px solid #CCD3DB;padding:3px 6px;white-space:nowrap}h3{font-size:14px;margin:16px 0 6px}</style>";
      wb.SheetNames.slice(0, 10).forEach(function(nm){
        var ws = wb.Sheets[nm];
        if (ws["!ref"]){   // 너무 큰 시트는 앞부분만
          var rg = X.utils.decode_range(ws["!ref"]);
          if (rg.e.r > 1000){ rg.e.r = 1000; ws["!ref"] = X.utils.encode_range(rg); }
        }
        html += "<h3>" + nm.replace(/[<&]/g, "") + "</h3>" + X.utils.sheet_to_html(ws, {header: "", footer: ""});
      });
      if (wb.SheetNames.length > 10) html += "<p>시트가 많아 앞 10개만 보여 줍니다.</p>";
      box.appendChild(mailFrame(html, false));
    });
  }
  function renderZipText(box, blob, kind){
    return Promise.all([loadLib("zip"), blob.arrayBuffer()]).then(function(r){
      return window.JSZip.loadAsync(r[1]);
    }).then(function(z){
      var names = Object.keys(z.files);
      if (kind === "zip"){
        var lines = names.filter(function(n){ return !z.files[n].dir; }).map(function(n){ return n; });
        box.appendChild(el("pre", null, "압축 안 파일 " + lines.length + "개\n\n" + lines.join("\n")));
        note(box, "압축 안의 파일은 저장해서 풀어 주세요.");
        return;
      }
      var re = kind === "hwpx" ? /^Contents\/section\d+\.xml$/i : /^ppt\/slides\/slide\d+\.xml$/i;
      var parts = names.filter(function(n){ return re.test(n); }).sort(sortNum);
      return Promise.all(parts.map(function(n){ return z.file(n).async("string"); })).then(function(xs){
        var txt = xs.map(function(x, i){ return (kind === "pptx" ? "[" + (i + 1) + "번 슬라이드]\n" : "") + xmlText(x); }).join("\n\n");
        box.appendChild(el("pre", null, txt || "(글자가 없습니다)"));
        note(box, kind === "hwpx" ? "한글 문서의 글자만 보여 줍니다. 표·그림 모양은 파일로 저장해서 확인해 주세요."
                                  : "슬라이드의 글자만 보여 줍니다. 디자인은 파일로 저장해서 확인해 주세요.");
      });
    });
  }
  function buildPreview(box, x, a, s){
    var type = (s.blob && s.blob.type) || a.mime || "";
    var kind = kindOf(a.name, type);
    if (!s.blob){
      // 원본 파일을 못 받은 경우: 글자로라도 보여 주고, 왜 원본이 없는지 알려 준다
      if (s.helperError){
        var hc = s.helperError.code;
        note(box, hc === "server_not_connected" || hc === "not_in_manifest"
          ? "원래 모양으로 보려면 PC의 첨부 도우미가 필요해요. Claude 앱을 완전히 종료했다가 다시 열어 주세요. 지금은 글자만 보여 드려요."
          : hc === "cancelled" ? "PC에서 첨부 도우미 사용을 허용하지 않아 글자만 보여 드려요. 다시 열면 한 번 더 물어봐요."
          : "첨부 도우미가 파일을 넘겨주지 못했어요 (" + (hc || "오류") + (s.helperError.message ? ": " + String(s.helperError.message).slice(0, 80) : "") + "). 글자만 보여 드려요.");
      }
      if (s.md && s.md.trim()) box.appendChild(mailFrame(mdToHtml(s.md.slice(0, 400000)), false));
      else if (s.text) box.appendChild(el("pre", null, s.text.slice(0, 200000)));
      else if (kind === "hwp") note(box, "옛 한글 형식(.hwp)은 여기서 열 수 없습니다.");
      else note(box, s.mdError ? "PC에서 이 파일을 읽지 못했습니다. (" + (s.mdError.code || "오류") + ")"
        : "미리 볼 파일 내용을 받지 못했어요." + (s.blockTypes ? " (받은 내용: " + s.blockTypes + ")" : ""));
      if (s.savedPath) note(box, "원본 파일은 PC의 " + s.savedPath + " 에 저장했습니다.");
      return;
    }
    var job = null;
    if (kind === "image"){ var img = document.createElement("img"); img.src = s.url; img.alt = a.name; box.appendChild(img); }
    else if (kind === "pdf") job = renderPdf(box, s.blob);
    else if (kind === "docx") job = renderDocx(box, s.blob);
    else if (kind === "sheet") job = renderSheet(box, s.blob);
    else if (kind === "pptx" || kind === "hwpx" || kind === "zip") job = renderZipText(box, s.blob, kind);
    else if (kind === "html") job = s.blob.text().then(function(t){ box.appendChild(mailFrame(t, false)); });
    else if (kind === "text") job = s.blob.text().then(function(t){ box.appendChild(el("pre", null, t.slice(0, 200000))); });
    else if (kind === "audio" || kind === "video"){
      var m = document.createElement(kind); m.controls = true; m.src = s.url; m.style.maxWidth = "100%"; box.appendChild(m);

  var contactsP = null;
  function loadContacts(){
    if (contactsP) return contactsP;
    var map = {};
    function add(addr, name, w){
      addr = String(addr || "").trim().toLowerCase();
      if (!validAddr(addr) || /no-?reply|noreply|mailer-daemon|notification|newsletter/i.test(addr)) return;
      var c = map[addr] || (map[addr] = {addr: addr, name: "", score: 0});
      if (name && !c.name && name.toLowerCase() !== addr) c.name = name;
      c.score += w;
    }
    function harvest(r, w){
      ((r.payload && r.payload.threads) || []).forEach(function(t){
        (t.messages || []).forEach(function(m){
          var names = {};
          (m.addressDisplayNames || []).forEach(function(d){ if (d && d.emailAddress) names[String(d.emailAddress).toLowerCase()] = d.displayName || ""; });
          var isSent = (m.labelIds || []).indexOf("SENT") !== -1;
          [].concat(m.toRecipients || [], m.ccRecipients || []).forEach(function(a){ if (isSent) add(a, names[String(a).toLowerCase()], w); });
          if (!isSent && m.sender) add(m.sender, names[String(m.sender).toLowerCase()], w / 3);
        });
      });
      return r.payload && r.payload.nextPageToken;
    }
    function page(query, token, w, left){
      var input = {query: query, pageSize: 50, view: "THREAD_VIEW_MINIMAL"};
      if (token) input.pageToken = token;
      return readTool("Gmail", "search_threads", input).then(function(r){
        var next = harvest(r, w);
        if (next && left > 1) return page(query, next, w, left - 1);
      });
    }
    contactsP = Promise.all([
      page("in:sent newer_than:2y", null, 3, 4),
      page("newer_than:6m -category:promotions -category:social -in:sent", null, 1, 2)
    ].map(function(p){ return p.catch(function(){}); })).then(function(){
      return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a, b){ return b.score - a.score; });

  function attachSuggest(input){

    function pick(c){
      var v = input.value, i = Math.max(v.lastIndexOf(","), v.lastIndexOf(";"));
      input.value = (i >= 0 ? v.slice(0, i + 1) + " " : "") + c.addr + ", ";
      box.hidden = true; input.focus();
    }
    function show(){
      var q = token().toLowerCase();
      if (q.length < 1){ box.hidden = true; return; }
      loadContacts().then(function(list){
        if (token().toLowerCase() !== q) return;
        var already = splitAddrs(input.value.toLowerCase());
        items = list.filter(function(c){ return already.indexOf(c.addr) === -1 && (c.addr.indexOf(q) !== -1 || (c.name && c.name.toLowerCase().indexOf(q) !== -1)); }).slice(0, 7);

          li.appendChild(t);
          li.addEventListener("mousedown", function(e){ e.preventDefault(); pick(c); });
          box.appendChild(li);
        });
        box.hidden = !items.length;
      });
    }
    input.addEventListener("input", show);
    input.addEventListener("focus", function(){ loadContacts(); });
    input.addEventListener("blur", function(){ setTimeout(function(){ box.hidden = true; }, 120); });
    input.addEventListener("keydown", function(e){
      if (box.hidden || !items.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault();
        idx = (idx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        Array.prototype.forEach.call(box.children, function(li, i){ li.classList.toggle("on", i === idx); });

      else if (e.key === "Escape"){ e.stopPropagation(); box.hidden = true; }
    });

  function remoteImgSrcs(html){
    var out = [], seen = {}, re = /<img\b[^>]*?\bsrc\s*=\s*(["']?)(https?:[^"'\s>]+)\1/gi, m;
    while ((m = re.exec(html))){ if (!seen[m[2]]){ seen[m[2]] = true; out.push(m[2]); } }
    return out;
  }
  function unescAttr(v){ return String(v).replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
  function replaceSrc(html, raw, dataUrl){ return html.split(raw).join(dataUrl); }
  function dataUrlOf(r){
    var bs = (r && r.content) || [];
    for (var i = 0; i < bs.length; i++){ var b = bs[i] || {}; if (typeof b.data === "string" && b.mimeType) return "data:" + b.mimeType + ";base64," + b.data; }
    // 큰 그림은 이미지 칸이 아니라 파일(resource) 칸으로 받는다 (이미지 칸의 큰 그림은 중간에 빠질 수 있다)
    for (var k = 0; k < bs.length; k++){ var rs = (bs[k] || {}).resource; if (rs && typeof rs.blob === "string" && /^image\//.test(rs.mimeType || "")) return "data:" + rs.mimeType + ";base64," + rs.blob; }
    return "";
  }
  function isInlinePart(a, m){
    if (!a.cid) return false;
    if (m.html && m.html.indexOf("cid:" + a.cid) !== -1) return true;
    return /^image\//.test(a.mime || "") && !/\.[a-z0-9]{2,5}$/i.test(a.name || "");   // 이름 없는 작은 본문 그림
  }
  // 바깥 그림: PC 첨부 도우미로 받아 데이터로 바꿔 넣는다 (claude.ai 안에서는 바깥 주소 그림을 직접 못 연다)
  function loadRemoteImages(x, o){
    var jobs = [];
    o.msgs.forEach(function(m){ if (m.html) remoteImgSrcs(m.htmlShown || m.html).slice(0, 40).forEach(function(raw){ jobs.push({m: m, raw: raw}); }); });
    if (!jobs.length){ bump(x); return; }
    var done = 0, ok = 0, firstErr = null, i = 0;
    o.imgMsg = "그림을 불러오는 중… 0/" + jobs.length; o.imgBad = false; bump(x);
    function worker(){
      if (i >= jobs.length) return Promise.resolve();
      var j = jobs[i++];
      return mcp.callTool(HOST.att, "fetch_image", {url: unescAttr(j.raw), as: "resource"}, {cache: false}).then(function(r){
        var d = dataUrlOf(r);
        if (d){ j.m.htmlShown = replaceSrc(j.m.htmlShown || j.m.html, j.raw, d); ok++; }
      }, function(e){ if (!firstErr) firstErr = e || {code: "upstream_error"}; }).then(function(){
        done++;
        o.imgMsg = "그림을 불러오는 중… " + done + "/" + jobs.length;
        if (done % 4 === 0) o.imgVer = (o.imgVer || 0) + 1;
        bump(x);
        return worker();
      });
    }
    Promise.all([worker(), worker(), worker(), worker()]).then(function(){
      o.imgVer = (o.imgVer || 0) + 1;
      if (ok === jobs.length) o.imgMsg = "";
      else if (!ok && firstErr && (firstErr.code === "not_in_manifest" || firstErr.code === "server_not_connected" || firstErr.code === "tool_error" && /unknown tool/i.test(firstErr.message || ""))){
        o.imgMsg = "바깥 그림을 보려면 PC의 첨부 도우미 새 버전이 필요해요. Claude 앱을 다시 시작해 주세요."; o.imgBad = true;
      } else {
        o.imgMsg = (jobs.length - ok) + "개 그림은 불러오지 못했어요." + (firstErr && firstErr.code === "cancelled" ? " (PC에서 허용하지 않음)" : ""); o.imgBad = !ok;
      }
      bump(x);
    });
  }
  // 본문 속 첨부 그림(cid:): 카카오·네이버는 imap에서 그 그림을 받아 넣는다 (Gmail은 Gmail이 처리)
  function resolveCids(x, o){
    o.cidDone = true;
    if (!x.acc) return;
    var jobs = [];
    o.msgs.forEach(function(m){
      if (!m.html || m.html.indexOf("cid:") === -1) return;
      m.att.forEach(function(a){ if (a.cid && m.html.indexOf("cid:" + a.cid) !== -1) jobs.push({m: m, a: a}); });
    });
    if (!jobs.length) return;
    o.cidBusy = true;
    Promise.all(jobs.map(function(j){
      return mcp.callTool(HOST.imap, "imap_download_attachment", {accountName: x.acc, folder: x.folder, uid: x.uid, filename: j.a.cid}, {cache: false}).then(function(r){
        var d = dataUrlOf(r);
        if (d) j.m.htmlShown = (j.m.htmlShown || j.m.html).split("cid:" + j.a.cid).join(d);
      }, function(){});
    })).then(function(){ o.cidBusy = false; o.imgVer = (o.imgVer || 0) + 1; bump(x); });
  }
