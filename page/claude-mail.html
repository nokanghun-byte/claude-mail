    return sampler().then(function(sm){
      if (!sm) throw {code: "not_granted"};
      var prompt = "아래 요청에 맞는 이메일 본문을 한국어로 써 주세요. 인사와 맺음말은 짧게, 서명과 제목은 빼고 본문만 쓰세요. 마크다운 기호는 쓰지 마세요.\n\n요청: " + instr +
        (ctx ? "\n\n참고할 원래 메일:\n" + ctx : "") + (ta.value.trim() ? "\n\n지금까지 쓴 내용(다듬어서 반영):\n" + ta.value : "");
      return sm(prompt, {onText: function(ev){ ta.value = ev.text; }});
    }).then(function(r){ ta.value = r.text.trim(); setStatus("AI 초안을 넣었어요. 고쳐서 보내세요."); },
            function(e){ setStatus(aiError(e), "bad"); });
  }
  // 오늘 할 일: 지금 목록의 메일에서 답장·확인이 필요한 것만 뽑는다
  function openTodo(){
    var data = store[keyOf(state.account)] || {};
    var items = (data.items || []).filter(function(x){ return !x.trashed && !x.sent && !x.isDraft && x.cat !== "ad"; }).slice(0, 60);
    var m = modal("할 일 뽑기", function(){ m.close(); });
    var b = m.body;
    if (!items.length){ b.appendChild(el("p", "cnote", "지금 목록에 메일이 없어요.")); return; }
    b.appendChild(el("p", "cnote", "지금 목록의 메일 " + items.length + "통에서 답장이나 확인이 필요한 것을 골라요. (광고는 빼요)"));
    var out = el("div", "picklist"); out.appendChild(el("span", "cnote", "AI가 살펴보는 중…")); b.appendChild(out);
    sampler().then(function(sm){
      if (!sm) throw {code: "not_granted"};
      var lines = items.map(function(x, i){ return i + "\t" + x.from + "\t" + x.subject + "\t" + (x.snippet || "").slice(0, 160); }).join("\n");
      var prompt = "아래는 받은 메일 목록입니다 (번호, 보낸 사람, 제목, 미리보기). 내가 답장하거나 확인·처리해야 하는 메일만 골라 JSON 배열로만 답하세요.\n" +
        "각 항목: {\"i\": 번호, \"task\": 할 일 한 줄(한국어, 20자 안팎), \"due\": 마감이 보이면 짧게 아니면 \"\", \"level\": \"high\"|\"normal\"}\n" +
        "뉴스레터·알림·영수증처럼 할 일이 없는 메일은 빼세요. 중요한 것부터 정렬하세요.\n\n" + lines;
      return sm.json(prompt, {modelTier: "quick"});
    }).then(function(arr){
      out.textContent = "";
      arr = Array.isArray(arr) ? arr : [];
      if (!arr.length){ out.appendChild(el("span", "cnote", "따로 처리할 메일이 없어 보여요.")); return; }
      arr.forEach(function(t){
        var x = items[t.i]; if (!x) return;
        var it = el("button", "pickitem todo" + (t.level === "high" ? " high" : "")); it.type = "button";
        it.appendChild(el("b", null, (t.level === "high" ? "● " : "") + String(t.task || x.subject)));
        it.appendChild(el("span", null, x.from + " · " + x.subject + (t.due ? " · 마감 " + t.due : "")));
        it.addEventListener("click", function(){ m.close(); select(x); });
        out.appendChild(it);
      });
    }, function(e){ out.textContent = ""; out.appendChild(el("span", "status bad", aiError(e))); });
  }

  // ---- 여러 메일 한꺼번에 ----
  function drawBulk(){
    var bar = $("bulkbar"); if (!bar) return;
    var ids = Object.keys(picked).filter(function(k){ return !picked[k].trashed; });
    bar.textContent = ""; bar.hidden = !ids.length && !bulkBusy;
    if (!ids.length) return;
    var xs = ids.map(function(k){ return picked[k]; });
    if (bulkBusy){ bar.hidden = false; bar.appendChild(el("b", null, bulkBusy)); return; }
    bar.appendChild(el("b", null, ids.length + "통 선택"));
    function run(label, fn){
      return btn(label, "", function(){
        var i = 0;
        (function next(){ if (i >= xs.length){ render(); return; } Promise.resolve(fn(xs[i++])).then(next, next); })();
      });
    }
    if (state.box === "trash"){ bar.appendChild(run("복원", function(x){ return restore(x); })); bar.appendChild(btn("선택 해제", "", function(){ picked = {}; render(); })); return; }
    bar.appendChild(run("읽음", function(x){ return x.unread ? markRead(x) : null; }));
    bar.appendChild(run("안 읽음", function(x){ return !x.unread && !x.sent ? markUnread(x) : null; }));
    bar.appendChild(run("별표", function(x){ return x.starred ? null : setStar(x, true); }));
    bar.appendChild(btn("삭제", "danger", function(){
      var ok = xs.filter(canDelete);
      if (!ok.length){ flash("고른 메일은 여기서 지울 수 없어요."); return; }
      askConfirm(ok.length + "통을 휴지통으로 옮길까요?", "휴지통으로", true).then(function(yes){
        if (!yes) return;
        var i = 0, moved = 0, failed = [];
        bulkBusy = "휴지통으로 옮기는 중… 0/" + ok.length; render();
        (function next(){
          if (i >= ok.length){
            bulkBusy = "";
            render();
            flash(failed.length ? moved + "통을 휴지통으로 옮겼어요. " + failed.length + "통은 못 옮겼어요." : "✓ " + moved + "통을 휴지통으로 옮겼어요.");
            return;
          }
          var x = ok[i++];
          trash(x).then(function(done){
            if (done) moved++; else failed.push(x);
            bulkBusy = "휴지통으로 옮기는 중… " + i + "/" + ok.length; render();
            next();
          });
        })();
      });
    }));
    bar.appendChild(btn("선택 해제", "", function(){ picked = {}; render(); }));
  }

  // ---- 전달·임시보관함 ----
  // 줄을 왼쪽으로 충분히 밀었다 놓으면 휴지통으로 (세로 스크롤은 그대로 둔다)
  var SWIPE_AT = 96;
  function attachSwipe(li, row, x){
    var sx = 0, sy = 0, dx = 0, tracking = false, decided = false;
    row.addEventListener("touchstart", function(e){
      if (e.touches.length !== 1 || x.deleting) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; tracking = true; decided = false;
      row.style.transition = "none";
    }, {passive: true});
    row.addEventListener("touchmove", function(e){
      if (!tracking) return;
      var mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
      if (!decided){
        if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
        decided = true;
        if (Math.abs(my) > Math.abs(mx) || mx > 0){ tracking = false; return; }   // 세로로 움직이면 스크롤
        li.classList.add("swiping");
      }
      dx = Math.min(0, mx);
      row.style.transform = "translateX(" + dx + "px)";
      li.classList.toggle("armed", dx < -SWIPE_AT);
      if (e.cancelable) e.preventDefault();
    }, {passive: false});
    function end(){
      if (!tracking) return;
      tracking = false;
      row.style.transition = "transform .2s ease";
      if (decided && Math.abs(dx) > 10) row._noClick = true;
      if (dx < -SWIPE_AT){
        row.style.transform = "translateX(-110%)";
        setTimeout(function(){
          trash(x).then(function(ok){ flash(ok ? "‘" + x.subject + "’ 메일을 휴지통으로 옮겼어요." : "휴지통으로 옮기지 못했어요."); if (!ok) render(); });
        }, 160);
      } else {
        row.style.transform = "";
        setTimeout(function(){ li.classList.remove("swiping", "armed"); }, 200);
      }
    }
    row.addEventListener("touchend", end);
    row.addEventListener("touchcancel", end);
  }

  function openForward(x, o){ if (composerOpen) return; composerOpen = true; x.replyMsg = ""; buildComposer(x, o, "fwd"); }
  function openDraft(d){
    if (composerOpen) return;
    composerOpen = true;
    if (!d.acc || d.body != null){ buildComposer(null, null, "draft", d); return; }
    // IMAP 임시보관 메일은 본문을 먼저 읽어 온다
    flash("임시보관 메일을 불러오는 중…");
    readTool(HOST.imap, "imap_get_email", {accountName: d.acc, folder: d.folder, uid: d.uid, bodyFormat: "text", maxContentLength: 200000, includeAttachmentText: false}).then(function(r){
      var e = (r.payload && r.payload.email) || {};
      d.body = String(e.textContent || e.markdownContent || "").replace(/\s+$/, "");
      if (addrList(e.to).length) d.to = addrList(e.to);
      d.cc = addrList(e.cc);
      buildComposer(null, null, "draft", d);
    }).catch(function(e){ composerOpen = false; flash("임시보관 메일을 열지 못했어요. " + errorText(e, d.acc)); });
  }

  // ---- 단축키 ----
  function visibleRows(){ return Array.prototype.slice.call(document.querySelectorAll("#list .mrow")); }
  function moveCursor(step){
    var rows = visibleRows(); if (!rows.length) return;
    var data = store[keyOf(state.account)] || {}, items = data.items || [];
    var idx = rows.findIndex(function(r){ return cursor && r.dataset.id === cursor.id; });
    idx = Math.max(0, Math.min(rows.length - 1, idx + step));
    var id = rows[idx].dataset.id;
    cursor = items.filter(function(x){ return x.id === id; })[0] || cursor;
    render();
    var r2 = document.querySelector('#list .mrow[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); if (r2){ r2.focus(); r2.scrollIntoView({block: "nearest"}); }
  }
  function openHelp(){
    var m = modal("단축키", function(){ m.close(); });
    [["j / k", "다음 / 이전 메일"], ["Enter", "메일 열기"], ["r", "답장"], ["a", "전체 답장"], ["f", "전달"], ["c", "새 메일 쓰기"],
     ["s", "별표"], ["u", "안 읽음으로"], ["e 또는 Delete", "삭제"], ["x", "선택"], ["/", "검색"], ["Esc", "닫기·목록으로"], ["?", "이 도움말"]].forEach(function(k){
      var row = el("div", "keyrow"); row.appendChild(el("kbd", null, k[0])); row.appendChild(el("span", null, k[1])); m.body.appendChild(row);
    });
  }
  document.addEventListener("keydown", function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector(".overlay") || composerOpen) return;
    var t = e.target; if (t && t.closest && t.closest("input,textarea,select,[contenteditable]")) return;
    var k = e.key, x = sel || cursor, o = x && open[x.id];
    if (k === "j"){ e.preventDefault(); moveCursor(1); }
    else if (k === "k"){ e.preventDefault(); moveCursor(-1); }
    else if (k === "/"){ e.preventDefault(); $("q").focus(); }
    else if (k === "?"){ e.preventDefault(); openHelp(); }
    else if (k === "c"){ e.preventDefault(); openNewMail(); }
    else if (k === "Enter" && cursor && !sel){ e.preventDefault(); if (cursor.isDraft) openDraft(cursor); else select(cursor); }
    else if (!x) return;
    else if (k === "x"){ e.preventDefault(); if (picked[x.id]) delete picked[x.id]; else picked[x.id] = x; render(); }
    else if (k === "s"){ e.preventDefault(); setStar(x, !x.starred); }
    else if (k === "u"){ e.preventDefault(); if (!x.sent) markUnread(x); }
    else if ((k === "e" || k === "Delete") && canDelete(x)){ e.preventDefault(); if (sel !== x) select(x); x.confirmDel = true; render(); }
    else if ((k === "r" || k === "a" || k === "f") && sel && o && o.msgs){ e.preventDefault(); if (k === "f") openForward(x, o); else openComposer(x, o, k === "a"); }
  });

  // ---- 새 메일 알림 ----
  // Gmail은 2분마다, IMAP 계정은 5분마다 오늘 받은메일함을 다시 읽는다.
  // 창이 뒤에 가려져 있어도 확인하고, 알림은 창을 다시 볼 때까지 남겨 둔다.
  // Gmail은 대화(스레드) 단위라서 같은 대화에 새 답장이 와도 알 수 있게 "id + 마지막 메일 시각"으로 기억한다.
  var known = {};     // 계정 -> {"id|시각": true}
  var imapOk = {};    // 불러오기에 성공한 IMAP 계정 (실패한 계정은 다음 차례에 다시 시도)
  function seenKey(x){ return x.id + "|" + (x.dateMs || 0); }
  function seedKnown(acc, items){ var k = known[acc] || (known[acc] = {}); items.forEach(function(x){ k[seenKey(x)] = true; }); }
  function mergeFresh(list, fresh){
    var ids = {}; fresh.forEach(function(x){ ids[x.id] = true; });
    list = fresh.concat(list.filter(function(x){ return !ids[x.id]; }));
    list.sort(function(a, b){ return b.dateMs - a.dateMs; });
    return list;
  }
  var polling = {};
  function poll(acc){
    if (!mcp || polling[acc]) return;
    var key = acc + "|inbox|today";
    if (store[key] && store[key].loading) return;
    polling[acc] = true;
    var p = acc === "gmail" ? fetchGmail("today", true, false) : fetchImap(acc, "today", true, false);
    p.then(function(res){
      if (acc !== "gmail") imapOk[acc] = true;
      var first = !known[acc];
      var fresh = first ? [] : res.items.filter(function(x){ return !known[acc][seenKey(x)] && x.unread; });
      seedKnown(acc, res.items);
      var d = store[key];
      if (d && d.items){
        if (fresh.length) d.items = mergeFresh(d.items, fresh);
        d.at = res.at;
      } else if (!d){
        res.items.sort(function(a, b){ return b.dateMs - a.dateMs; });
        store[key] = res;
      }
      var dall = store["all|inbox|today"];
      if (fresh.length && dall && dall.items) dall.items = mergeFresh(dall.items, fresh);
      if (fresh.length){ fresh.sort(function(a, b){ return b.dateMs - a.dateMs; }); showToasts(acc, fresh); }
      render();
    }).catch(function(){ /* 알림 확인 실패는 조용히 넘긴다. 다음 차례에 다시 확인한다 */ })
      .then(function(){ polling[acc] = false; });
  }
  function toastHost(){
    var h = $("toasts");
    if (!h){ h = el("div", "toasts"); h.id = "toasts"; h.setAttribute("aria-live", "polite"); document.body.appendChild(h); }
    return h;
  }
  function openFromToast(acc, x){
    state.account = acc; state.box = "inbox"; state.range = "all"; state.cat = "all"; persist();
    render();
    if (x){ select(x); }
  }
  function showToasts(acc, list){
    var host = toastHost();
    var items = list.length > 3 ? [null] : list;
    items.forEach(function(x){
      var t = el("div", "toast"); t.setAttribute("role", "status"); t.tabIndex = 0;
      var ic = el("span", "tic", ACC[acc].label.charAt(0)); ic.style.setProperty("--c", accColor(acc));
      t.appendChild(x ? avatar(x.from) : ic);
      var b = el("div", "tbody");
      b.appendChild(el("span", "tk", "새 메일 · " + ACC[acc].label));
      if (x){
        b.appendChild(el("b", null, x.from));
        b.appendChild(el("span", "ts", x.subject));
      } else {
        b.appendChild(el("b", null, "새 메일 " + list.length + "통이 왔어요"));
        b.appendChild(el("span", "ts", list.slice(0, 3).map(function(y){ return y.from; }).join(", ") + " 외"));
      }
      t.appendChild(b);
      var cl = iconBtn("x"); cl.type = "button"; cl.title = "알림 닫기"; cl.setAttribute("aria-label", "알림 닫기");
      cl.addEventListener("click", function(e){ e.stopPropagation(); gone(); });
      t.appendChild(cl);
      function gone(){ t.classList.add("out"); setTimeout(function(){ t.remove(); }, 200); }
      function go(){ gone(); openFromToast(acc, x); }
      t.addEventListener("click", go);
      t.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
      // 창이 가려져 있을 때 온 알림은 다시 볼 때부터 시간을 잰다
      var timer = null;
      function arm(ms){ clearTimeout(timer); timer = document.hidden ? null : setTimeout(gone, ms); }
      t._arm = arm;
      arm(12000);
      t.addEventListener("mouseenter", function(){ clearTimeout(timer); });
      t.addEventListener("mouseleave", function(){ arm(4000); });
      host.appendChild(t);
      while (host.children.length > 4) host.firstChild.remove();
    });
  }
  setInterval(function(){ poll("gmail"); }, 2 * 60 * 1000);
  setInterval(function(){ imapNames().forEach(function(a){ poll(a); }); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) return;
    document.querySelectorAll(".toast").forEach(function(t){ if (t._arm) t._arm(12000); });
  });

  document.querySelectorAll("[data-box]").forEach(function(b){
    b.addEventListener("click", function(){ state.box = b.dataset.box; sel = null; persist(); load(false); });
  });
  document.querySelectorAll("[data-range]").forEach(function(b){
    b.addEventListener("click", function(){ state.range = b.dataset.range; sel = null; persist(); load(false); });
  });
  $("unreadOnly").addEventListener("change", function(e){ state.unreadOnly = e.target.checked; persist(); render(); });
  $("refresh").addEventListener("click", function(){ load(true); });
  $("searchForm").addEventListener("submit", function(e){ e.preventDefault(); var v = $("q").value.trim(); if (v === state.q) return; state.q = v; sel = null; load(false); });
  $("q").addEventListener("keydown", function(e){ if (e.key === "Escape" && state.q){ e.stopPropagation(); state.q = ""; $("q").value = ""; sel = null; load(false); } });
  $("qClear").addEventListener("click", function(){ state.q = ""; $("q").value = ""; sel = null; load(false); });
  $("sigBtn").addEventListener("click", openSigManager);
  $("composeBtn").addEventListener("click", openNewMail);
  $("composeBtn2").addEventListener("click", openNewMail);
  $("todoBtn").addEventListener("click", openTodo);
  $("helpBtn").addEventListener("click", openHelp);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && sel && !composerOpen && !document.querySelector(".overlay") && !e.target.closest("input,textarea")) closeReader();
  });
  document.addEventListener("visibilitychange", function(){
    if (document.hidden || !mcp) return;
    var d = store[keyOf(state.account)];
    // Gmail만 자동으로 다시 읽는다. 카카오·네이버는 PC 확인 창이 뜰 수 있어 버튼을 눌렀을 때만 읽는다.
    if (state.account === "gmail" && d && d.at && Date.now() - d.at > 5 * 60 * 1000 && !d.loading) load(true);
  });

  render();
  initSigStore();
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(ns){ downloads = ns || null; render(); }).catch(function(){});
  }
  var boot = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("mcp").catch(function(){ return null; })
    : Promise.resolve(null);
  boot.then(function(ns){
    mcp = ns || null;
    return resolveHosts().then(function(){ mcpReady = true; return ns; });
  }).then(function(ns){
    // 카카오·네이버가 마지막 선택이었어도 첫 화면은 Gmail로 연다. PC 확인 창이 페이지를 열자마자 뜨지 않게 하려는 것.
    if (state.account !== "gmail"){ state.account = "gmail"; }
    load(false);
    if (mcp){
      setTimeout(function(){ if (!known.gmail) poll("gmail"); }, 4000);
      // IMAP 계정도 처음에 한 번 읽어 두어야 그다음부터 새 메일을 알아챈다
      setTimeout(function(){ ensureImapAccounts().then(function(){ imapNames().forEach(function(a){ if (!known[a]) poll(a); }); }).catch(function(){}); }, 8000);
    }
  });
})();
</script>
